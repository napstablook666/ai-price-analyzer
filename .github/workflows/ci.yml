name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  # 同一个 PR / 同一个分支连着推两次，旧的这次已经没有意义，直接取消。
  # 按 PR 号分组，push 到 main 用 sha 分组，两种情况互不打扰。
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

env:
  # Plugin sources are checked out as a sibling repository copy inside this workspace.
  PLUGIN_DIR: plugins

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out extension repository
        uses: actions/checkout@v4

      - name: Check out plugin sources
        uses: actions/checkout@v4
        with:
          repository: napstablook666/ai-price-analyzer-plugins
          ref: main
          path: plugins
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check generated plugin files
        run: node scripts/plugin-build.mjs --check

      # 这两条以前只写在 npm run verify 里，CI 从来没跑过。
      # 校验写好了没人跑，等于没写——复盘里最贵的一条教训，先在这里补上。
      - name: Check DOM id contract
        run: npm run ids:check

      - name: Check version consistency
        run: npm run version:check

      - name: Check extension syntax and manifest
        shell: bash
        run: |
          set -euo pipefail
          node --check src/service-worker.js
          node --check src/dashboard.js
          node --check src/options.js
          node --check src/content-bridge.js
          node --check src/page-bridge.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"
          node --check src/core/dom-guard.js
          node --check src/dom-contract.js
          test -f dashboard.html
          test -f options.html
          test -s icons/icon.svg
          test -s icons/icon-16.png
          test -s icons/icon-32.png
          test -s icons/icon-48.png
          test -s icons/icon-128.png

      - name: Run extension unit tests
        run: npm test

      - name: Check public repository files
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s README.en.md
          test -s LICENSE
          test -s PRIVACY.md
          test -s docs/user-guide.md
          test -s docs/development.md
          test -s docs/plugin-development.md
          test -s assets/tokenflux-pricing-analysis.png

      - name: Scan tracked source for obvious secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude-dir=plugins --exclude='*.png' --exclude='*.jpg' \
            "(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{20,}|password[[:space:]]*[:=][[:space:]]*[\"'][^\"']{12,}[\"']|password[[:space:]]*[:=][[:space:]]*[[:alnum:]_+=/-]{16,})" \
            src scripts canonical docs README.md README.en.md CONTRIBUTING.md PRIVACY.md SECURITY.md; then
            echo "Potential credential marker found. Review the match before publishing."
            exit 1
          fi