name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  # Plugin sources are checked out as a sibling repository copy inside this workspace.
  PLUGIN_DIR: plugins

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out extension repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out plugin sources
        uses: actions/checkout@v4
        with:
          repository: napstablook666/ai-price-analyzer-plugins
          ref: refs/tags/${{ github.ref_name }}
          path: plugins
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate source and release tag
        shell: bash
        run: |
          set -euo pipefail
          node scripts/plugin-build.mjs --check
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const packageVersion = JSON.parse(readFileSync("package.json", "utf8")).version; const manifestVersion = JSON.parse(readFileSync("manifest.json", "utf8")).version; if (packageVersion !== manifestVersion || "v" + manifestVersion !== process.env.GITHUB_REF_NAME) process.exit(1);'
          node --check src/service-worker.js
          node --check src/dashboard.js
          node --check src/options.js
          node --check src/content-bridge.js
          node --check src/page-bridge.js
          npm test

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist/source/plugins
          git archive --format=tar HEAD | tar -x -C dist/source
          git -C plugins archive --format=tar HEAD | tar -x -C dist/source/plugins
          (
            cd dist/source
            # update.bat / update.ps1 只进包，不进 update.json 的文件表：扩展不去写自己。
            zip -qr "../../dist/ai-relay-price-extension-${version}.zip" \
              manifest.json dashboard.html options.html styles.css styles icons src \
              update.bat update.ps1
            zip -qr "../../ai-price-analyzer-${version}-source.zip" .
          )
          # 校验文件里只写文件名：两个包上传后都落在 release 根目录，写成 dist/... 会让下载方 sha256sum -c 找不到文件。
          (
            cd dist
            sha256sum "ai-relay-price-extension-${version}.zip" "../ai-price-analyzer-${version}-source.zip" | sed 's#\.\./##' > SHA256SUMS.txt
          )

      - name: Build signed update.json
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          node scripts/build-update-manifest.mjs \
            --source dist/source \
            --zip "dist/ai-relay-price-extension-${version}.zip" \
            --version "$version" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${version}/ai-relay-price-extension-${version}.zip" \
            --out dist/update.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/ai-relay-price-extension-${{ github.ref_name }}.zip
            ai-price-analyzer-${{ github.ref_name }}-source.zip
            dist/SHA256SUMS.txt
            dist/update.json
            dist/source/update.ps1