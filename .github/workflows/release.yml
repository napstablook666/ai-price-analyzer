name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out extension repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out plugin sources
        uses: actions/checkout@v4
        with:
          repository: napstablook666/ai-price-analyzer-plugins
          ref: main
          path: plugins
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate source and release tag
        shell: bash
        run: |
          set -euo pipefail
          node scripts/plugin-build.mjs --check
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const packageVersion = JSON.parse(readFileSync("package.json", "utf8")).version; const manifestVersion = JSON.parse(readFileSync("extension/manifest.json", "utf8")).version; if (packageVersion !== manifestVersion || "v" + manifestVersion !== process.env.GITHUB_REF_NAME) process.exit(1);'
          node --check extension/src/service-worker.js
          node --check extension/src/dashboard.js
          node --check extension/src/options.js
          node --check extension/src/content-bridge.js
          node --check extension/src/page-bridge.js
          node --check extension/src/popup.js
          npm test

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist/source/plugins
          cp README.md README.zh-CN.md LICENSE PRIVACY.md RELEASE_NOTES.md CONTRIBUTING.md SECURITY.md package.json dist/source/
          cp -R assets canonical docs extension scripts dist/source/
          cp -R plugins/. dist/source/plugins/
          (
            cd extension
            zip -qr "../dist/ai-relay-price-extension-${version}.zip" .
          )
          (
            cd dist/source
            zip -qr "../../ai-price-analyzer-${version}-source.zip" .
          )
          sha256sum "dist/ai-relay-price-extension-${version}.zip" "ai-price-analyzer-${version}-source.zip" > dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
          files: |
            dist/ai-relay-price-extension-${{ github.ref_name }}.zip
            ai-price-analyzer-${{ github.ref_name }}-source.zip
            dist/SHA256SUMS.txt
