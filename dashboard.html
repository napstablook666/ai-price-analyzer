<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Model Atlas · 价格对比</title>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/dashboard.css">
  <script src="src/theme-boot.js"></script>
</head>
<body class="dashboard-page">
  <header class="topbar dashboard-topbar">
    <a class="brand-lockup" href="dashboard.html" aria-label="Model Atlas 首页">
      <span class="brand-mark"><img class="brand-image" src="icons/icon.svg" alt=""></span>
      <span class="brand-copy"><span class="brand-overline">MODEL ATLAS</span><strong>价格对比</strong></span>
    </a>
    <nav class="top-actions" aria-label="页面操作">
      <span class="system-readout"><span class="status-dot" id="connection-dot"></span><span id="last-updated">尚未刷新</span></span>
      <div class="comparison-mode" role="group" aria-label="比较来源">
        <button class="comparison-mode-button is-active" type="button" data-comparison-mode="paid" aria-pressed="true">付费中转站</button>
        <button class="comparison-mode-button" type="button" data-comparison-mode="public" aria-pressed="false">公益站</button>
      </div>
      <button class="button button-primary" id="refresh-all" type="button"><span data-icon="refresh-cw" class="icon"></span><span>刷新全部</span></button>
      <details class="top-menu" id="top-menu">
        <summary class="button button-quiet" aria-label="打开菜单" aria-expanded="false"><span data-icon="menu" class="icon"></span><span>菜单</span></summary>
        <div class="top-menu-body" role="menu" aria-label="页面操作">
          <button class="top-menu-item" role="menuitem" id="collapse-toggle" type="button" title="折叠全部卡片" aria-label="折叠全部卡片"><span data-icon="chevrons-up-down" class="icon"></span><span data-collapse-label>折叠全部</span></button>
          <div class="top-menu-sep" role="separator"></div>
          <button class="top-menu-item" role="menuitem" id="refresh-station" type="button" disabled title="先在站点筛选中选择一个站点" aria-label="刷新当前站点"><span data-icon="refresh-cw" class="icon"></span><span>刷新当前站点</span></button>
          <div class="top-menu-sep" role="separator" id="checkin-sep" hidden></div>
          <button class="top-menu-item" role="menuitem" id="checkin-toggle" type="button" aria-expanded="false" aria-controls="checkin-group" data-menu-stay hidden><span data-icon="badge-check" class="icon"></span><span>每日签到</span><span data-icon="chevron-right" class="icon checkin-caret"></span></button>
          <div class="top-menu-checkin" id="checkin-group" role="group" aria-label="每日签到" hidden>
            <div class="top-menu-checkin-head"><button class="button button-quiet" id="checkin-refresh" type="button"><span data-icon="refresh-cw" class="icon"></span><span>刷新状态</span></button></div>
            <div class="checkin-list" id="checkin-list"></div>
          </div>
        </div>
      </details>
      <button class="button button-quiet" id="open-settings" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="站点与设置" title="站点与设置"><span data-icon="settings-2" class="icon"></span><span>设置</span></button>
      <button class="theme-toggle" id="theme-toggle" type="button" data-theme-toggle aria-label="切换到夜晚主题" title="切换到夜晚"><span data-icon="moon" class="icon theme-icon-moon"></span><span data-icon="sun" class="icon theme-icon-sun"></span></button>
    </nav>
  </header>

  <main class="page-shell">
    <section class="dashboard-heading" aria-labelledby="page-title">
      <div><p class="eyebrow">MODEL EXPLORER</p><h1 id="page-title">模型报价</h1></div>
    </section>

    <section class="panel refresh-preflight-panel" id="refresh-preflight-panel" aria-labelledby="refresh-preflight-title" hidden>
      <div class="refresh-preflight-heading"><div><h2 id="refresh-preflight-title">页面登录状态</h2></div><div class="refresh-preflight-actions"><button class="button button-quiet" id="cancel-refresh-preflight" type="button" disabled><span data-icon="x" class="icon"></span><span>取消</span></button><button class="button button-primary" id="confirm-refresh-all" type="button" disabled><span data-icon="check" class="icon"></span><span>确认开始刷新全部</span></button></div></div>
      <p id="refresh-preflight-status" role="status" aria-live="polite"></p>
      <ul id="refresh-preflight-results"></ul>
    </section>
    <section class="panel refresh-progress-panel" id="refresh-progress-panel" aria-label="站点模型查询进度" hidden>
      <div class="refresh-progress-heading"><div><h2>采集进度</h2></div><span id="refresh-progress-count">0 / 0 站点</span></div>
      <progress id="refresh-progress-bar" max="1" value="0" aria-label="已完成的站点查询数"></progress>
      <p id="refresh-progress-message" role="status" aria-live="polite" aria-atomic="true"></p>
      <ul id="refresh-progress-results" aria-live="off"></ul>
    </section>

    <section class="summary-grid" id="summary" aria-label="统计摘要"></section>

<div class="dashboard-workspace">
      <aside class="dashboard-sidebar" aria-label="筛选与签到">
        <section class="panel toolbar-panel" id="toolbar-panel" data-collapsible aria-label="筛选和排序">
<div class="panel-heading"><div><h2>筛选和排序</h2></div></div>
          <div class="toolbar-main">
            <label class="search-field"><span data-icon="search" class="icon"></span><span class="sr-only">搜索模型或站点</span><input id="search" type="search" placeholder="搜索模型、站点或供应商" autocomplete="off"></label>
            <details class="facet-menu station-filter-menu" id="station-filter-menu"><summary><span data-icon="building-2" class="icon"></span><span id="station-filter-label">全部中转站</span></summary><div class="facet-menu-body"><input class="facet-search" type="search" data-facet-search="station" placeholder="搜索站点" aria-label="搜索站点" autocomplete="off"><div class="facet-options" id="station-filters"></div></div></details>
            <details class="facet-menu"><summary><span data-icon="database" class="icon"></span><span>供应商</span></summary><div class="facet-menu-body"><input class="facet-search" type="search" data-facet-search="provider" placeholder="搜索供应商" aria-label="搜索供应商" autocomplete="off"><div class="facet-menu-actions"><button type="button" data-facet-action="all" data-facet-key="provider">全选</button><button type="button" data-facet-action="none" data-facet-key="provider">清空</button></div><div class="facet-options" id="provider-filters"></div></div></details>
            <details class="facet-menu"><summary><span data-icon="layers-3" class="icon"></span><span>分组</span></summary><div class="facet-menu-body"><input class="facet-search" type="search" data-facet-search="group" placeholder="搜索分组" aria-label="搜索分组" autocomplete="off"><div class="facet-menu-actions"><button type="button" data-facet-action="all" data-facet-key="group">全选</button><button type="button" data-facet-action="none" data-facet-key="group">清空</button></div><div class="facet-options" id="group-filters"></div></div></details>
            <label class="select-field sort-field"><span class="sr-only">排序方式</span><span data-icon="arrow-down-up" class="icon"></span><select id="sort-by"><option value="groupName">分组</option><option value="provider" data-paid-only="true">官方源</option><option value="model">模型名称</option><option value="monthlyCost" data-paid-only="true">月成本</option><option value="blendedUnitPrice" data-paid-only="true" selected>混合单价</option><option value="diffPercent" data-paid-only="true">价差</option><option value="confidenceScore">匹配置信度</option></select></label>
            <label class="select-field direction-field"><span class="sr-only">排序方向</span><select id="sort-direction"><option value="asc" selected>升序</option><option value="desc">降序</option></select></label>
<label class="secondary-sort"><span>次级排序</span><select id="sort-secondary"><option value="diffPercent" data-paid-only="true" selected>价差</option><option value="model">模型名称</option><option value="monthlyCost" data-paid-only="true">月成本</option><option value="confidenceScore">匹配置信度</option><option value="none">不使用</option></select></label>
            <button class="button button-quiet paid-only-control" id="fetch-references" type="button"><span data-icon="external-link" class="icon"></span><span>更新官方价</span></button>
            <button class="button button-quiet" id="reset-filters" type="button" title="重置筛选"><span data-icon="x" class="icon"></span><span>重置</span></button>
          </div>
          <details class="facet-menu model-filter-menu compare-row" id="model-filter-menu" open><summary><span data-icon="sliders-horizontal" class="icon"></span><span id="model-filter-label">模型对比</span></summary><div class="facet-menu-body model-filter-body"><div class="model-filter-inputs" id="model-filter-inputs" role="group" aria-labelledby="model-filter-label"></div><div class="model-filter-actions"><button class="model-filter-add" id="model-filter-add" type="button" aria-label="添加筛选框" title="添加筛选框"><span data-icon="plus" class="icon"></span><span>添加筛选框</span></button><button class="model-filter-remove-box" id="model-filter-remove-box" type="button" aria-label="移除最后一个筛选框" title="移除最后一个筛选框" hidden><span data-icon="x" class="icon"></span></button></div></div></details>
          <div class="toolbar-options"><label class="check-label paid-only-control"><input id="show-unmatched" type="checkbox"><span>显示未匹配</span></label><p class="comparison-mode-note" id="comparison-mode-note" role="status" aria-live="polite"></p><div id="station-errors" class="station-errors" role="status" aria-live="polite" hidden></div></div>
        </section>
</aside>

        <section class="panel comparison-panel" id="comparison-panel" data-collapsible aria-labelledby="comparison-title">
      <div class="panel-heading"><div><h2 id="comparison-title">价格明细</h2></div><div class="comparison-meta"><span class="result-count" id="result-count">0 条报价</span><span class="reference-status" id="reference-pill"><span class="status-dot" id="reference-dot"></span><span id="reference-status">官方价未加载</span><span class="reference-time" id="reference-note"></span></span></div></div>
      <div class="table-wrap" tabindex="0" role="region" aria-label="模型价格表，可滚动">
        <table class="comparison-table">
          <thead><tr><th scope="col" data-sort-keys="model provider">模型</th><th scope="col" data-sort-keys="groupName">中转站</th><th scope="col" colspan="3" class="paid-only-column merged-price-heading" data-sort-keys="monthlyCost"><span class="merged-price-heading-label"><span>中转单价 / 官方单价 / 月成本</span><span class="monthly-cost-scale-switch" role="group" aria-label="月成本柱标尺"><button type="button" data-monthly-cost-scale="model" aria-pressed="true" title="每个模型独立按组内最高月成本满格">同模型</button><button type="button" data-monthly-cost-scale="global" aria-pressed="false" title="所有筛选后的模型共用最高月成本标尺">全局绝对</button></span></span><span class="cost-header-ruler" id="monthly-cost-ruler" title="同模型对比：每个模型组内最高月成本满格"><span class="cost-header-track"><span></span></span><span class="cost-header-scale"><span>0</span><span id="monthly-cost-scale-max">— / 月</span></span></span></th><th scope="col" class="paid-only-column" data-sort-keys="diffPercent">价差</th><th scope="col" class="paid-only-column" data-sort-keys="blendedUnitPrice" title="柱子表示当前行混合单价；虚线是官方混合单价">混合单价</th><th scope="col" class="public-only-column" hidden>状态</th></tr></thead>
          <tbody id="comparison-body"></tbody>
        </table>
      </div>
      <nav class="comparison-pagination" id="comparison-pagination" aria-label="报价分页" hidden>
        <label class="page-size-field"><span>每页</span><select id="page-size" aria-label="每页显示数量"><option value="20" selected>20</option><option value="50">50</option><option value="100">100</option><option value="200">200</option><option value="500">500</option></select><span>条</span></label>
        <button class="button button-quiet" id="comparison-previous" type="button" aria-label="上一页" title="上一页"><span data-icon="chevron-left" class="icon"></span><span>上一页</span></button>
        <span id="comparison-page" aria-live="polite"></span>
        <button class="button button-quiet" id="comparison-next" type="button" aria-label="下一页" title="下一页"><span>下一页</span><span data-icon="chevron-right" class="icon"></span></button>
      </nav>
      <div class="empty-state" id="empty-state" hidden><span data-icon="database" class="icon empty-icon"></span><h3>还没有可比较的报价</h3><p>添加中转站并刷新即可。</p><button class="button button-primary" type="button" data-open-settings="stations"><span data-icon="plus" class="icon"></span><span id="empty-state-action-label">添加第一个站点</span></button></div>
    </section>
    </div>
  </main>
<div class="settings-layer" id="settings-layer" hidden>
    <div class="settings-scrim" data-close-settings></div>
    <aside class="settings-sheet" role="dialog" aria-modal="true" aria-labelledby="settings-sheet-title">
      <header class="settings-sheet-head">
        <div><p class="eyebrow">WORKSPACE SETTINGS</p><h2 id="settings-sheet-title">站点与设置</h2></div>
        <button class="button button-quiet" id="close-settings" type="button" data-close-settings><span data-icon="x" class="icon"></span><span>关闭</span></button>
      </header>
      <iframe class="settings-frame" id="settings-frame" title="站点与设置" data-embed-src="options.html?embed=1#installed"></iframe>
    </aside>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <button class="back-to-top" id="back-to-top" type="button" aria-label="回到顶部" title="回到顶部" hidden><span data-icon="arrow-up" class="icon"></span></button>
  <script type="module" src="src/dashboard.js"></script>
</body>
</html>
