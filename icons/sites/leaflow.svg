<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 160 160"
    width="64"
    height="64"
>
    <!-- 亮色标签栏用深色主花瓣，斜向浅色花瓣加灰色描边以区分底色；暗色标签栏改为主花瓣带浅色描边，按系统主题切换。 -->
    <style>
        .facet {
            fill: #e2e3e6;
            stroke: #6b6e76;
        }
        .cardinal {
            fill: #151619;
            stroke: none;
        }
        @media (prefers-color-scheme: dark) {
            .facet {
                fill: #c3c4c9;
                stroke: none;
            }
            .cardinal {
                stroke: #f9fafb;
            }
        }
    </style>

    <!-- 花瓣几何与 components/ui/octa-spinner/octa-spinner.tsx 的 PETAL_PATH 相同；放大 4%，主花瓣尖端贴近画布边缘。 -->
    <g transform="translate(80 80) scale(1.04) translate(-80 -80)">
        <!-- 与主花瓣同法：只露出外侧一半描边；共用的内侧边被主花瓣覆盖，描边只出现在外沿。 -->
        <g
            class="facet"
            stroke-width="10"
            stroke-linejoin="round"
            paint-order="stroke"
        >
            <path
                d="M80 80 L64.7 43 L80 8 L95.3 43 Z"
                transform="rotate(45 80 80)"
            />
            <path
                d="M80 80 L64.7 43 L80 8 L95.3 43 Z"
                transform="rotate(135 80 80)"
            />
            <path
                d="M80 80 L64.7 43 L80 8 L95.3 43 Z"
                transform="rotate(225 80 80)"
            />
            <path
                d="M80 80 L64.7 43 L80 8 L95.3 43 Z"
                transform="rotate(315 80 80)"
            />
        </g>
        <!-- 描边先画、填充盖在上面，只露出外侧一半；圆角连接，尖端不被斜接拉长。 -->
        <g
            class="cardinal"
            stroke-width="8"
            stroke-linejoin="round"
            paint-order="stroke"
        >
            <path d="M80 80 L64.7 43 L80 8 L95.3 43 Z" />
            <path
                d="M80 80 L64.7 43 L80 8 L95.3 43 Z"
                transform="rotate(90 80 80)"
            />
            <path
                d="M80 80 L64.7 43 L80 8 L95.3 43 Z"
                transform="rotate(180 80 80)"
            />
            <path
                d="M80 80 L64.7 43 L80 8 L95.3 43 Z"
                transform="rotate(270 80 80)"
            />
        </g>
    </g>
</svg>
