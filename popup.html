<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Model Atlas · 快捷操作</title>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/popup.css">
  <script src="src/theme-boot.js"></script>
</head>
<body class="popup-page">
  <main class="popup-shell">
    <header class="popup-header">
      <span class="popup-brand-mark"><img class="brand-image" src="icons/icon.svg" alt=""></span>
      <div class="popup-brand-copy"><span>MODEL ATLAS</span><h1>价格对比</h1></div>
      <button class="popup-icon-button" type="button" data-theme-toggle aria-label="切换到夜晚主题" title="切换到夜晚"><span data-icon="moon" class="icon theme-icon-moon"></span><span data-icon="sun" class="icon theme-icon-sun"></span></button>
      <button class="popup-icon-button" id="open-settings" type="button" aria-label="打开站点与设置" title="站点与设置"><span data-icon="settings-2" class="icon"></span></button>
    </header>

    <section class="popup-section" aria-labelledby="popup-overview-title">
      <div class="popup-section-heading"><h2 id="popup-overview-title">查看与刷新</h2><span class="popup-section-index">01</span></div>
      <div class="popup-actions">
        <button class="popup-action popup-action-primary" id="open-dashboard" type="button">
          <span data-icon="arrow-up-right" class="icon"></span>
          <span class="popup-action-copy"><strong>打开价格对比</strong><small>查看站点报价与模型对比</small></span>
        </button>
        <button class="popup-action" id="refresh-all" type="button">
          <span data-icon="refresh-cw" class="icon"></span>
          <span class="popup-action-copy"><strong>检查登录状态</strong><small>先检查需要登录的站点</small></span>
        </button>
      </div>
    </section>

    <section class="popup-section" aria-labelledby="popup-current-title">
      <div class="popup-section-heading"><h2 id="popup-current-title">当前页面</h2><span class="popup-section-index">02</span></div>
      <p class="popup-context" id="current-page">正在读取当前页面…</p>
      <button class="popup-action" id="add-current-site" type="button" disabled>
        <span data-icon="wand-sparkles" class="icon"></span>
        <span class="popup-action-copy"><strong>识别当前站点</strong><small>从当前页面识别采集配置</small></span>
      </button>
    </section>

    <section class="popup-section popup-section-last" aria-labelledby="popup-manage-title">
      <div class="popup-section-heading"><h2 id="popup-manage-title">站点服务</h2><span class="popup-section-index">03</span></div>
      <button class="popup-action" id="checkin-now" type="button" hidden>
        <span data-icon="sparkles" class="icon"></span>
        <span class="popup-action-copy"><strong>站点签到</strong><small id="checkin-note">复用登录态直接签到</small></span>
      </button>
      <button class="popup-text-link" id="manage-stations" type="button"><span data-icon="layers-3" class="icon"></span><span>管理站点插件与采集配置</span><span data-icon="chevron-right" class="icon"></span></button>
    </section>

    <progress id="refresh-progress" max="1" value="0" aria-label="已完成的站点查询数" hidden></progress>
    <p class="popup-status" id="popup-status" role="status" aria-live="polite" aria-atomic="true" hidden></p>
  </main>
  <script type="module" src="src/popup.js"></script>
</body>
</html>
